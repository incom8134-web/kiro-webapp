# Picks ONE speed source for the wheels.
#   higher priority wins while it is sending; a source that is silent for `timeout` seconds is dropped
#   e_stop = true blocks everything
twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      web:              # the command center (laptop or phone)
        topic: cmd_vel_web
        timeout: 0.5
        priority: 10
      joystick:         # a gamepad plugged into the robot itself: local override
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0    # 0 = the last value stays until changed
        priority: 255
