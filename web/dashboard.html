<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KIRO Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dash">
<header class="bar">
  <div class="brand">KIRO<a class="dash-link" href="./" data-i18n="dash.control">Control</a></div>
  <div class="cells">
    <div class="cell"><span class="k" data-i18n="top.robot">Robot</span><b id="backend">...</b></div>
    <div class="cell"><span class="k" data-i18n="top.link">Link</span><b id="link">...</b></div>
    <div class="cell"><span class="k" data-i18n="top.operator">Operator</span><b id="opstat">...</b></div>
    <div class="cell"><span class="k" data-i18n="d.uptime">Uptime</span><b id="uptime">...</b></div>
    <div class="cell"><span class="k" data-i18n="d.devices">Devices</span><b id="devices">...</b></div>
  </div>
  <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ko">한국어</button></div>
  <button id="estop" class="estop" type="button" data-i18n="estop">E-STOP</button>
</header>

<div id="banner" class="banner" hidden></div>

<div class="dgrid">
  <section class="dview cam">
    <div class="dhead"><span data-i18n="d.camera">Camera</span><span id="cam-name" class="mute"></span></div>
    <div class="dbody dark">
      <img id="cam" alt="" hidden>
      <div id="cam-empty" class="empty"><span id="cam-msg"></span></div>
    </div>
  </section>
  <section class="dview">
    <div class="dhead"><span data-i18n="d.lidarview">Lidar</span><span id="scan-src" class="mute"></span></div>
    <div class="dbody"><canvas id="lidar"></canvas></div>
  </section>
</div>

<div class="tiles" id="tiles"></div>

<div class="lower">
  <section class="dsec">
    <h2><span class="n">01</span><span data-i18n="d.servos">Servo boards</span></h2>
    <table class="kv dtable" id="servos"></table>
  </section>
  <section class="dsec">
    <h2><span class="n">02</span><span data-i18n="d.programs">Programs</span></h2>
    <table class="kv dtable" id="programs"></table>
    <h2 style="margin-top:18px"><span class="n">03</span><span data-i18n="sec.voice">Voice</span></h2>
    <p class="big-quote" id="voice">-</p>
  </section>
  <section class="dsec">
    <h2><span class="n">04</span><span data-i18n="sec.log">Activity</span></h2>
    <ul id="log" class="log"></ul>
  </section>
</div>
<div class="foot" id="ver"></div>
<script src="i18n.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
